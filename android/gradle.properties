org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- Android Gradle Plugin 9 opt-outs -------------------------------------
# AGP 9 enables two breaking defaults: the new `android {}` DSL (the legacy
# BaseExtension / `applicationVariants` API disappears) and built-in Kotlin.
#
# Flutter 3.41.6's dev.flutter.flutter-gradle-plugin still reads the legacy DSL
# extension, and this app applies `kotlin-android`, so both AGP 9 defaults stay
# off until Flutter migrates (flutter/flutter#180137, #189235). Keep the pair
# together and drop them once Flutter supports the new defaults; AGP 10 removes
# the opt-outs.
#
# Optimized resource shrinking is unaffected: from AGP 9 it is always applied
# when isShrinkResources is enabled (see android/app/build.gradle.kts).
android.newDsl=false
android.builtInKotlin=false
