# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.
#
# CI runs the analyzer with `--fatal-warnings`, so any warning or error
# fails the build. Do not add `// ignore:` comments to
# silence lints without a linked issue and a justification.

# Strict lint set from Very Good Ventures. See
# https://pub.dev/packages/very_good_analysis for the enabled rules.
include: package:very_good_analysis/analysis_options.yaml

# Melos workspace import boundaries (custom lint, CI-enforced):
# `tool/check_feature_boundaries.py` (rules P1-P4) scans `packages/*`:
# P1 no cross-package data/ imports, P2 core never imports features,
# P3 feature-to-feature via domain/ (+ documented shared widgets and
# the reminders navigation route), P4 get_it only in
# `*_service_locator.dart`. The legacy monolith guard
# (`tool/check_layer_boundaries.py`, rules R1-R5) still scans `lib/`.
# Run `melos boundaries` (or `python3 tool/check_feature_boundaries.py`)
# locally; CI fails the PR on violation. Per-package `analysis_options.yaml`
# files (if added) must include this root file so the workspace shares one
# lint set.

analyzer:
  errors:
    # CI runs with `--fatal-warnings`: warnings fail the build, infos don't.
    # The rules below are disabled because they don't fit this project's
    # established style (see justification per rule). Re-enable per rule
    # once the codebase is migrated, rather than adding `// ignore:`s.
    public_member_api_docs: ignore # 800+ violations: public API is
      # documented at the feature level (README/AGENTS.md), not per member.
      # Doc comments are still welcome on non-obvious public APIs.
