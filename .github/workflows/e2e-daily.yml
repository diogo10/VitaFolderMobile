name: E2E (daily)

# Device end-to-end suite (e2e.com) for the onboarding journey. See
# .agents/plans/e2e-onboarding.md and e2e/README.md.
#
# Nightly + on demand. Not wired to pull_request on purpose: a cold emulator
# job costs ~20 minutes, and the Flutter suites already gate PRs.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 01:00 America/Sao_Paulo
  workflow_dispatch:

concurrency:
  group: e2e-daily
  cancel-in-progress: false

env:
  # No telemetry from CI (e2e.com/docs/telemetry#in-ci).
  E2E_TELEMETRY_DISABLED: '1'

jobs:
  android-onboarding:
    name: Android — onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The e2e suite runs against the prod Supabase project: onboarding is
      # pre-auth and never writes, and no dedicated dev/e2e project exists yet
      # (only SUPABASE_URL_PROD / SUPABASE_PUBLISHABLE_KEY_PROD are configured).
      # Do not copy these two lines into a suite that signs in or writes — point
      # them at a dedicated project instead. Keeping the E2E names makes that a
      # two-line change here rather than an edit in every step.
      SUPABASE_URL_E2E: ${{ secrets.SUPABASE_URL_PROD }}
      SUPABASE_PUBLISHABLE_KEY_E2E: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Verify e2e configuration is complete
        # Fail here instead of at launch: an empty Supabase URL makes
        # AppConfig throw at startup, which surfaces as APP_UNREACHABLE on every
        # test and looks like a device problem.
        run: |
          if [ -z "$SUPABASE_URL_E2E" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY_E2E" ]; then
            echo "::error::SUPABASE_URL_E2E / SUPABASE_PUBLISHABLE_KEY_E2E are empty (they come from the PROD secrets today; see e2e/README.md)."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK for e2e
        # Profile and debug also run the suite (verified 6/6 each); release is
        # used because it is the only build type with R8 + resource shrinking
        # enabled here, so a missing proguard keep-rule fails this job instead
        # of shipping. Without android/key.properties the build signs with the
        # debug key, which is all an emulator needs.
        run: >
          flutter build apk --release
          --dart-define=APP_FLAVOR=dev
          --dart-define=E2E_MODE=true
          --dart-define=SUPABASE_URL=$SUPABASE_URL_E2E
          --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY_E2E

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Typecheck the e2e suite
        # Seconds, versus discovering a typo after the emulator boots.
        working-directory: e2e
        run: npm run typecheck

      - name: Verify e2e config resolves and tests are discovered
        # Same CLI the emulator step runs, from the same directory: catches a
        # config the suite cannot find, a broken install, or an empty test
        # selection in seconds instead of after the emulator has booted.
        working-directory: e2e
        run: |
          test -x node_modules/.bin/e2e || {
            echo "::error::e2e CLI missing from e2e/node_modules - did 'npm ci' run?"
            exit 1
          }
          node_modules/.bin/e2e list --target android

      - name: Check the e2e runner script parses
        # A syntax error in ci-android.sh would otherwise surface only after the
        # emulator has booted, ~10 minutes into the job.
        run: bash -n e2e/ci-android.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run e2e on the emulator
        # The action boots (and retries booting) the emulator, so a boot failure
        # is its own step failure instead of an opaque APP_UNREACHABLE.
        # api-level is pinned: the accessibility tree differs between Android
        # releases, and an image bump must be a deliberate change.
        #
        # `script` is one line on purpose: the action runs every line of it in
        # its own `/usr/bin/sh -c`, so a `cd e2e` on one line does not carry
        # over to the next. That broke every nightly from 2026-11-12 to 11-15
        # (the suite ran at the repo root and exited CONFIG_NOT_FOUND). All the
        # steps now live in e2e/ci-android.sh, which resolves the repo itself.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -no-snapshot
            -gpu swiftshader_indirect
          script: bash e2e/ci-android.sh

      - name: Upload e2e report
        # report.json, junit.xml and results/ (trace page + screenshots per
        # test). Kept even on failure: that is the point of the artifact.
        #
        # `include-hidden-files: true`: the bundle lives in `.e2e/`, and
        # upload-artifact v4 skips hidden paths by default. Without it the upload
        # found nothing on 2026-11-17 even though the run had written
        # `.e2e/junit.xml`, and failed a job whose six tests had passed.
        #
        # `warn` instead of `error`: this step is best effort, so the verdict
        # comes from the run step and a missing report can never turn a red run
        # green or a green run red. The "a green run produced a report" guarantee
        # lives in e2e/ci-android.sh, right after the run, where it can name the
        # missing file instead of surfacing as an upload error.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android
          path: e2e/.e2e/
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
