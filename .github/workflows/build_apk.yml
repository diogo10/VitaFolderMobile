name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android signing
        # Same stable upload keystore as build_aab_release.yml. Without this,
        # the profile APK falls back to the runner's ephemeral debug key whose
        # SHA-1 changes every run — and Google Sign-In (bound to
        # package name + SHA-1) can never be registered for it.
        # Required secrets: ANDROID_KEYSTORE_BASE64,
        # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/android.keystore
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=android.keystore"
          } > android/key.properties

      - name: Build APK (prod)
        # Prod backend credentials come from GitHub secrets (never hardcoded).
        # See README "Environments & secrets" for the required secrets.
        run: >
          flutter build apk --profile
          --dart-define=APP_FLAVOR=prod
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD }}

      - name: Enforce performance budgets + report build
        run: |
          bash tool/check_performance_budgets.sh | tee budget-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: 1:140355243144:android:a6ac1f14183172f272633d
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ secrets.FIREBASE_TESTERS }}
          file: build/app/outputs/flutter-apk/app-profile.apk
          releaseNotes: ${{ github.sha }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-profile
          path: |
            budget-report.md
            build/app/outputs/flutter-apk/*.apk
          retention-days: 3
