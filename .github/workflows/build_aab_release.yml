name: Build AAB (Production Release)

# Production-only release pipeline. Versioning/build-number logic lives in
# the "Resolve release version" step (tool/resolve_release_version.py) and is
# never applied to development or profile builds.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: >
          Version name (e.g. 1.0.0). Leave empty to use pubspec.yaml.
        required: false
        default: ""
      build_number:
        description: >
          Build number / Android versionCode (e.g. 1). Leave empty to use
          pubspec.yaml.
        required: false
        default: ""

env:
  PROPERTIES_PATH: "./android/key.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release version
        # Single source of truth: pubspec.yaml `version: <name>+<number>`
        # (e.g. `1.0.0+1`). Optional workflow inputs override it; anything
        # malformed fails the job instead of guessing a default.
        id: version
        run: |
          python3 tool/resolve_release_version.py \
            --version-name "${{ inputs.version_name }}" \
            --build-number "${{ inputs.build_number }}" | tee version.env
          {
            echo "version_name=$(grep '^VERSION_NAME=' version.env | cut -d= -f2)"
            echo "build_number=$(grep '^BUILD_NUMBER=' version.env | cut -d= -f2)"
          } >> "$GITHUB_OUTPUT"
          cat version.env >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Android signing
        # Decodes the upload keystore (base64) and writes key.properties
        # consumed by android/app/build.gradle.kts. Required secrets:
        # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/android.keystore
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=android.keystore"
          } > "$PROPERTIES_PATH"

      - name: Build AAB (prod release)
        # Prod backend credentials come from GitHub secrets (never hardcoded).
        # See README "Environments & secrets" for the required secrets.
        run: >
          flutter build appbundle --release
          --build-name=${{ steps.version.outputs.version_name }}
          --build-number=${{ steps.version.outputs.build_number }}
          --dart-define=APP_FLAVOR=prod
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY_PROD }}

      - name: Enforce performance budgets + report build
        run: |
          bash tool/check_performance_budgets.sh | tee budget-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab-release-${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.build_number }}
          path: |
            budget-report.md
            version.env
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Release app to Internal
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_ACCOUNT_KEY }}
          packageName: com.housemira.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          status: completed
          track: internal