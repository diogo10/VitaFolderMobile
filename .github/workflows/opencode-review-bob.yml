name: opencode-review-bob

on:
  workflow_call:
    inputs:
      pr:
        description: 'PR number to review (defaults to the triggering PR)'
        required: false
        type: string
    secrets:
      OPENCODE_API_KEY:
        description: 'Optional OpenCode/Zen API key (free models work without it)'
        required: false
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review (defaults to the current branch PR)'
        required: false
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: opencode-review-bob-${{ inputs.pr }}${{ github.event.pull_request.number }}${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenCode v2 CLI
        run: |
          # Same installer as .devcontainer/Dockerfile. Tracks OpenCode v2
          # directly instead of the V1-based action.
          curl -fsSL https://opencode.ai/v2/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          "$HOME/.opencode/bin/opencode" --version

      - name: Review PR with OpenCode v2
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ inputs.pr }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(gh pr view --json number --jq .number)"
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a numeric PR number (got: '$PR_NUMBER')."
            exit 1
          fi
          echo "Reviewing PR #$PR_NUMBER"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Manual runs may target a PR on another branch: check out its head
          # so the diff and the working tree describe the same PR.
          if [ -n "${{ inputs.pr }}" ]; then
            gh pr checkout "$PR_NUMBER"
          fi

          BASE="$(gh pr view "$PR_NUMBER" --json baseRefName --jq .baseRefName 2>/dev/null || echo main)"
          git fetch origin "$BASE" --depth=50 || true
          git diff "origin/$BASE...HEAD" > /tmp/pr_diff.txt 2>/dev/null || true
          if [ ! -s /tmp/pr_diff.txt ]; then
            gh pr diff "$PR_NUMBER" > /tmp/pr_diff.txt
          fi
          if [ ! -s /tmp/pr_diff.txt ]; then
            echo "::error::PR diff is empty, nothing to review."
            exit 1
          fi
          DIFF_STAT="$(git diff --stat "origin/$BASE...HEAD" 2>/dev/null || gh pr diff --stat "$PR_NUMBER" || true)"

          cat > /tmp/review_prompt.txt <<'PROMPT_EOF'
          You are reviewing pull request #__PR_NUMBER__. The working directory is
          the checked-out repo. The full PR diff is included inline below under
          "PR DIFF" (truncated to the first 100KB when very large). Inspect the
          changed files using repo-relative paths only; do not read absolute
          paths outside the repo.

          Check for: correctness and bugs, security issues, performance problems,
          Flutter/Dart idioms, error handling (Either<Failure, T>, no fake
          fallbacks), architecture (feature-first layers, one Cubit per concern,
          sealed states, no Supabase imports in cubits), localization via
          AppLocalizations (no hardcoded displayed text), and test coverage.

          Your output MUST start with exactly one line in the form "GRADE: X"
          where X is one of A, B, C, D:
          - A = excellent, merge-ready as is.
          - B = good with only minor nits, safe to merge.
          - C = needs changes before merge.
          - D = major issues, do not merge.

          After the grade line, include "## Summary", "## Findings"
          (with file:line references), and "## Suggestions" sections. Keep it
          concise and actionable.
          PROMPT_EOF
          sed -i "s/__PR_NUMBER__/$PR_NUMBER/" /tmp/review_prompt.txt

          MESSAGE="$(cat /tmp/review_prompt.txt)"
          MESSAGE="$MESSAGE

          PR DIFF STAT:
          $DIFF_STAT

          PR DIFF:
          $(head -c 100000 /tmp/pr_diff.txt)"

          # Post feedback even when the model run fails, then fail closed so a
          # missing review can never look like an approval.
          set +e
          "$HOME/.opencode/bin/opencode" run \
            --model opencode/muse-spark-1.3-contributor-free \
            "$MESSAGE" | tee /tmp/review_output.txt
          RUN_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$RUN_STATUS" -ne 0 ]; then
            {
              echo "## OpenCode v2 review failed"
              echo ""
              echo "The review run exited with status $RUN_STATUS for PR #$PR_NUMBER."
              echo ""
              echo "<details><summary>Runner log</summary>"
              echo ""
              echo '```'
              tail -c 20000 /tmp/review_output.txt
              echo '```'
              echo "</details>"
            } > /tmp/review_failure.txt
            gh pr comment "$PR_NUMBER" --body-file /tmp/review_failure.txt || true
            echo "::error::OpenCode review run failed (status $RUN_STATUS)."
            exit 1
          fi

          GRADE="$(grep -oE 'GRADE: [ABCD]' /tmp/review_output.txt | head -1 | awk '{print $2}' || true)"
          echo "Parsed grade: ${GRADE:-<none>}"
          echo "grade=${GRADE:-}" >> "$GITHUB_OUTPUT"

      - name: Publish review and approve/merge on grade A or B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PR_NUMBER="${{ steps.review.outputs.pr_number }}"
          GRADE="${{ steps.review.outputs.grade }}"
          echo "PR #$PR_NUMBER graded: ${GRADE:-<none>}"

          # GitHub caps comment bodies; truncate long reviews for the comment.
          head -c 60000 /tmp/review_output.txt > /tmp/review_comment.txt
          gh pr comment "$PR_NUMBER" --body-file /tmp/review_comment.txt

          if [ "$GRADE" = "A" ] || [ "$GRADE" = "B" ]; then
            echo "Grade $GRADE is merge-ready: approving and merging."
            gh pr review "$PR_NUMBER" --approve \
              --body "OpenCode v2 review grade: $GRADE. Approving per review policy."
            gh pr merge "$PR_NUMBER" --squash || \
              echo "::warning::gh pr merge failed (checks may still be running or branch protection may require manual merge)."
          else
            echo "Grade ${GRADE:-<none>} is not merge-ready: leaving review comment only."
          fi
