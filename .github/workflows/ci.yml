name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check-no-hardcoded-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: bash tool/check_no_hardcoded_secrets.sh

  analyze-and-test:
    needs: [check-no-hardcoded-secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Dart Analyze
        run: dart analyze --fatal-warnings

      - name: Flutter Analyze
        # flutter analyze defaults --fatal-infos to on, which fails the build
        # on info-level lints (e.g. public_member_api_docs from
        # very_good_analysis). Infos are style suggestions, not compliance
        # failures: keep warnings/errors fatal, but do not fail on infos.
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce 100% business-logic coverage
        # Gate lives in tool/check_business_logic_coverage.py (same logic as
        # the former inline script) so it can also run locally.
        run: python3 tool/check_business_logic_coverage.py

      - name: Check startup/APK performance budgets
        # Verifies the host startupBudget constants stay in sync with
        # tool/performance_budgets.json. APK size is checked here when an
        # APK exists, and always in the build-apk workflow with reporting.
        run: bash tool/check_performance_budgets.sh >> "$GITHUB_STEP_SUMMARY"
  build-budgets:
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK for size reporting
        # Debug build needs no backend secrets; it exists only so the
        # budget script can measure and report APK size in every PR.
        run: flutter build apk --debug

      - name: Enforce performance budgets + report build
        run: |
          bash tool/check_performance_budgets.sh | tee budget-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload budget report
        uses: actions/upload-artifact@v4
        with:
          name: budget-report
          path: |
            budget-report.md
            build/app/outputs/flutter-apk/*.apk
          retention-days: 3

  call-bob:
    needs: [analyze-and-test]
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ./.github/workflows/opencode-review-bob.yml
    secrets: inherit
