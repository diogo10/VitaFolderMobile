name: Automerge

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
  check_run:
    types:
      - completed
  status:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    name: Automerge
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce the review gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Only a pull request whose head commit carries a successful
          # "GRADE=A" review status may be merged. Every other pull request
          # loses the `automerge` label before the merge step runs, so this
          # workflow cannot merge it: a lower grade, a review that never
          # finished and new commits after an A grade all keep the pull
          # request open for a human.
          #
          # The gate script is taken from the base branch, so a pull request
          # cannot change the rules that decide whether it is merged.
          BASE="$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null || echo main)"
          git fetch origin "$BASE" --depth=1 || true
          if git cat-file -e "origin/$BASE:tool/review_merge_gate.py" 2>/dev/null; then
            git show "origin/$BASE:tool/review_merge_gate.py" > /tmp/review_merge_gate.py
            echo "Using the merge gate from origin/$BASE."
          else
            cp tool/review_merge_gate.py /tmp/review_merge_gate.py
            echo "::warning::Could not read the merge gate from origin/$BASE; using the working-tree copy."
          fi
          # The gate fails (and nothing is merged) when it cannot tell
          # whether a pull request is merge-ready.
          python3 /tmp/review_merge_gate.py enforce

      - name: Merge eligible pull requests
        uses: lirantal/github-action-automerge@1.0.1
        env:
          # The review bot merges with a squash, so the label-driven merge
          # must not create a merge commit instead.
          MERGE_METHOD: squash
