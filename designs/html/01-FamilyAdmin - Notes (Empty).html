<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes (Empty)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes fabPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(139,115,85,0.38); }
            50% { box-shadow: 0 8px 40px rgba(139,115,85,0.55); }
        }

        .fade-in { animation: fadeIn 0.5s ease both; }
        .scale-in { animation: scaleIn 0.45s ease both; }
        .slide-up { animation: slideInUp 0.45s ease both; }
        .slide-up-1 { animation-delay: 0.08s; }
        .slide-up-2 { animation-delay: 0.16s; }
        .float-anim { animation: floatSoft 5s ease-in-out infinite; }

        .nav-item { transition: transform 0.18s ease, color 0.18s ease; }
        .nav-item:active { transform: scale(0.94); }

        .action-btn { transition: transform 0.15s ease, background-color 0.2s ease; }
        .action-btn:active { transform: scale(0.95); }

        .fab-btn {
            animation: fabPulse 3s ease-in-out infinite;
            transition: transform 0.15s ease;
        }
        .fab-btn:active { transform: scale(0.92); }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        figtree: ['Figtree', 'sans-serif'],
                    },
                    colors: {
                        sand: {
                            50: '#faf8f5',
                            100: '#f0ebe3',
                            200: '#e4dace',
                            300: '#c9b99a',
                            400: '#b8a080',
                            500: '#8b7355',
                            600: '#7a6348',
                            700: '#634f39',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sand-50 font-figtree" style="max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative;">

    <!-- STATUS BAR -->
    <div id="status-bar" class="bg-sand-50 px-5 pt-3 pb-1 flex justify-between items-center">
        <span class="text-sand-500 text-xs font-outfit font-medium">9:41 AM</span>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-wifi text-sand-500 text-xs"></i>
            <i class="fa-solid fa-signal text-sand-500 text-xs"></i>
            <i class="fa-solid fa-battery-three-quarters text-sand-500 text-xs"></i>
        </div>
    </div>

    <!-- TOP NAV (logged-in, matches Notes.html) -->
    <header id="header" class="bg-sand-50 px-5 pt-2 pb-3 flex justify-between items-center fade-in sticky top-0 z-30">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-sand-500 flex items-center justify-center">
                <i class="fa-solid fa-house-chimney text-sand-50 text-sm"></i>
            </div>
            <span class="font-outfit font-semibold text-sand-600 text-base tracking-tight">FamilyAdmin</span>
        </div>
        <div class="flex items-center gap-3">
            <button class="action-btn w-10 h-10 rounded-full bg-sand-100 flex items-center justify-center" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass text-sand-500 text-base"></i>
            </button>
            <button class="action-btn w-10 h-10 rounded-full overflow-hidden border-2 border-sand-300" aria-label="Profile">
                <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" class="w-full h-full object-cover" alt="Admin">
            </button>
        </div>
    </header>

    <!-- EMPTY STATE (matches notes_design_empty_list.pdf) -->
    <main id="main-content" class="pb-48 overflow-y-auto flex flex-col items-center px-6" style="min-height: calc(100vh - 220px);">

        <!-- Illustration: white tile with doc + add badge -->
        <section id="empty-hero" class="flex flex-col items-center pt-16 scale-in">
            <div class="float-anim relative bg-white flex items-center justify-center" style="width: 190px; height: 190px; border-radius: 52px; box-shadow: 0 18px 48px rgba(139,115,85,0.14);">
                <!-- document -->
                <div class="relative" style="width: 76px; height: 88px; background: #ece5d8; border-radius: 12px 12px 12px 12px;">
                    <!-- folded corner -->
                    <div class="absolute bottom-0 right-0 bg-white" style="width: 28px; height: 28px; border-top-left-radius: 10px;"></div>
                    <div class="absolute bottom-0 right-0" style="width: 28px; height: 28px; background: #e0d6c2; border-top-left-radius: 10px; clip-path: polygon(0 0, 0 100%, 100% 100%);"></div>
                </div>
                <!-- add badge -->
                <div class="absolute flex items-center justify-center bg-amber-50 border border-amber-100" style="width: 52px; height: 52px; border-radius: 18px; top: 52px; right: 40px; box-shadow: 0 6px 18px rgba(217,119,6,0.18);">
                    <i class="fa-solid fa-plus text-amber-500 text-lg"></i>
                </div>
            </div>
        </section>

        <!-- Copy -->
        <section id="empty-copy" class="fade-in flex flex-col items-center mt-10">
            <h1 class="font-outfit font-bold text-sand-700 text-center" style="font-size: 1.7rem; line-height: 1.2;">No notes yet</h1>
            <p class="font-figtree text-sand-400 text-center mt-3 leading-relaxed" style="font-size: 0.95rem; max-width: 290px;">
                Shared thoughts, grocery lists, or important family info will appear here.
            </p>
        </section>

        <!-- CTA -->
        <section id="empty-actions" class="slide-up slide-up-1 mt-8">
            <button id="create-note-btn" class="action-btn bg-sand-500 text-sand-50 font-outfit font-semibold rounded-2xl flex items-center justify-center gap-2 px-8" style="height: 60px; font-size: 1rem; box-shadow: 0 8px 24px rgba(139,115,85,0.30);">
                Create Your First Note
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
        </section>

    </main>

    <!-- FAB (rounded squircle, matches PDF) -->
    <button id="fab-btn" aria-label="Add note" class="fab-btn fixed z-40 flex items-center justify-center bg-sand-500" style="width: 60px; height: 60px; border-radius: 22px; bottom: 120px;">
        <i class="fa-solid fa-plus text-sand-50 text-xl"></i>
    </button>

    <!-- BOTTOM NAVIGATION (flat style, matches PDF) -->
    <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full bg-sand-50 border-t border-sand-200 flex items-start justify-around px-4 pt-3 pb-8 z-30" style="max-width: 430px;">
        <button class="nav-item flex flex-col items-center gap-1.5 min-w-[56px]" data-tab="Home">
            <i class="fa-solid fa-house text-lg text-sand-300"></i>
            <span class="font-figtree font-medium text-sand-300" style="font-size: 11px;">Home</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1.5 min-w-[56px]" data-tab="People">
            <i class="fa-solid fa-people-group text-lg text-sand-300"></i>
            <span class="font-figtree font-medium text-sand-300" style="font-size: 11px;">People</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1.5 min-w-[56px]" data-tab="Notes">
            <i class="fa-solid fa-note-sticky text-lg text-sand-700"></i>
            <span class="font-figtree font-semibold text-sand-700" style="font-size: 11px;">Notes</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1.5 min-w-[56px]" data-tab="Reminders">
            <i class="fa-solid fa-bell text-lg text-sand-300"></i>
            <span class="font-figtree font-medium text-sand-300" style="font-size: 11px;">Reminders</span>
        </button>
        <button class="nav-item flex flex-col items-center gap-1.5 min-w-[56px]" data-tab="Account">
            <i class="fa-solid fa-circle-user text-lg text-sand-300"></i>
            <span class="font-figtree font-medium text-sand-300" style="font-size: 11px;">Account</span>
        </button>
    </nav>

    <script>
        // Bottom nav tab switching (flat PDF style: active = sand-700, idle = sand-300)
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach((item) => {
            item.addEventListener('click', () => {
                navItems.forEach((nav) => {
                    const icon = nav.querySelector('i');
                    const label = nav.querySelector('span');
                    const isActive = nav === item;
                    icon.classList.toggle('text-sand-700', isActive);
                    icon.classList.toggle('text-sand-300', !isActive);
                    label.classList.toggle('text-sand-700', isActive);
                    label.classList.toggle('text-sand-300', !isActive);
                    label.classList.toggle('font-semibold', isActive);
                    label.classList.toggle('font-medium', !isActive);
                });
            });
        });

        // FAB responsive positioning (pinned inside the 430px container)
        function positionFab() {
            const fab = document.getElementById('fab-btn');
            const bodyMaxW = 430;
            const windowW = window.innerWidth;
            const containerW = Math.min(windowW, bodyMaxW);
            const rightEdge = (windowW - containerW) / 2 + 20;
            fab.style.right = rightEdge + 'px';
        }
        positionFab();
        window.addEventListener('resize', positionFab);

        // CTA pressed feedback
        const cta = document.getElementById('create-note-btn');
        cta.addEventListener('click', () => {
            const original = cta.innerHTML;
            cta.innerHTML = '<i class="fa-solid fa-check text-sm"></i> Let\'s go';
            setTimeout(() => { cta.innerHTML = original; }, 1200);
        });
    </script>

</body>
</html>
