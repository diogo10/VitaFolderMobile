<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script> window.FontAwesomeConfig = { autoReplaceSvg: 'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .slide-up-1 { animation: slideInUp 0.5s ease both; animation-delay: 0.05s; }
        .slide-up-2 { animation: slideInUp 0.5s ease both; animation-delay: 0.14s; }
        .slide-up-3 { animation: slideInUp 0.5s ease both; animation-delay: 0.23s; }
        .slide-up-4 { animation: slideInUp 0.5s ease both; animation-delay: 0.32s; }
        .slide-up-5 { animation: slideInUp 0.5s ease both; animation-delay: 0.40s; }

        .fade-in { animation: fadeIn 0.55s ease both; }
        .scale-in { animation: scaleIn 0.45s ease both; }
        .float-anim { animation: float 4s ease-in-out infinite; }

        .action-btn { transition: transform 0.15s ease; }
        .action-btn:active { transform: scale(0.95); }

        .input-field {
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            outline: none;
        }
        .input-field:focus {
            border-color: #8b7355;
            box-shadow: 0 0 0 3px rgba(139,115,85,0.12);
        }

        .social-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .social-btn:active { transform: scale(0.96); }

        .feature-chip { animation: fadeIn 0.5s ease both; }
        .feature-chip:nth-child(1) { animation-delay: 0.1s; }
        .feature-chip:nth-child(2) { animation-delay: 0.2s; }
        .feature-chip:nth-child(3) { animation-delay: 0.3s; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        outfit: ['Outfit', 'sans-serif'],
                        figtree: ['Figtree', 'sans-serif'],
                    },
                    colors: {
                        sand: {
                            50: '#faf8f5',
                            100: '#f0ebe3',
                            200: '#e4dace',
                            300: '#c9b99a',
                            400: '#b8a080',
                            500: '#8b7355',
                            600: '#7a6348',
                            700: '#634f39',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sand-50 font-figtree" style="max-width: 430px; margin: 0 auto; min-height: 100vh; position: relative; overflow-x: hidden;">

    <!-- STATUS BAR -->
    <div id="status-bar" class="bg-sand-50 px-5 pt-3 pb-1 flex justify-between items-center">
        <span class="text-sand-500 text-xs font-outfit font-medium">9:41 AM</span>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-wifi text-sand-500 text-xs"></i>
            <i class="fa-solid fa-signal text-sand-500 text-xs"></i>
            <i class="fa-solid fa-battery-three-quarters text-sand-500 text-xs"></i>
        </div>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <main id="main-content" class="pb-10 overflow-y-auto">

        <!-- HERO SECTION -->
        <section id="hero-section" class="px-6 pt-6 pb-4 flex flex-col items-center fade-in">

            <!-- Brand Mark -->
            <div class="flex items-center gap-2.5 mb-6">
                <div class="w-10 h-10 rounded-2xl bg-sand-500 flex items-center justify-center shadow-md">
                    <i class="fa-solid fa-house-chimney text-sand-50 text-base"></i>
                </div>
                <span class="font-outfit font-bold text-sand-600 text-xl tracking-tight">FamilyAdmin</span>
            </div>

            <!-- Illustration -->
            <div class="relative w-40 h-40 flex items-center justify-center mb-4">
                <div class="absolute w-40 h-40 rounded-full bg-sand-100 opacity-60"></div>
                <div class="absolute w-28 h-28 rounded-full bg-sand-200 opacity-40"></div>
                <div class="float-anim w-20 h-20 bg-sand-500 rounded-3xl flex items-center justify-center shadow-xl" style="box-shadow: 0 12px 32px rgba(139,115,85,0.32);">
                    <i class="fa-solid fa-people-roof text-sand-50" style="font-size: 2rem;"></i>
                </div>
                <!-- Floating badge avatars -->
                <div class="absolute top-2 right-3 flex -space-x-2">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" class="w-8 h-8 rounded-full border-2 border-sand-50 object-cover shadow-sm">
                    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-8 h-8 rounded-full border-2 border-sand-50 object-cover shadow-sm">
                    <div class="w-8 h-8 rounded-full border-2 border-sand-50 bg-sand-400 flex items-center justify-center shadow-sm">
                        <span class="font-outfit font-bold text-sand-50 text-xs">+3</span>
                    </div>
                </div>
                <!-- Bell badge -->
                <div class="absolute bottom-2 left-2 w-9 h-9 bg-white rounded-2xl flex items-center justify-center shadow-md border border-sand-100">
                    <i class="fa-solid fa-bell text-sand-500 text-sm"></i>
                </div>
            </div>

            <!-- Headline -->
            <h1 class="font-outfit font-bold text-sand-700 text-center leading-tight" style="font-size: 1.75rem; line-height: 1.18;">Your family,<br><span class="text-sand-500">organised together</span></h1>
            <p class="font-figtree text-sand-400 text-sm text-center mt-3 max-w-[270px] leading-relaxed">
                Manage your circle, set reminders and collaborate as a family — all in one place.
            </p>

            <!-- Feature chips -->
            <div class="flex items-center gap-2 mt-4 flex-wrap justify-center">
                <span class="feature-chip bg-amber-50 text-amber-700 border border-amber-200 font-figtree font-semibold text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-broom text-amber-500 text-xs"></i> Chores
                </span>
                <span class="feature-chip bg-blue-50 text-blue-700 border border-blue-200 font-figtree font-semibold text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-calendar-check text-blue-400 text-xs"></i> Appointments
                </span>
                <span class="feature-chip bg-rose-50 text-rose-600 border border-rose-200 font-figtree font-semibold text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <i class="fa-solid fa-people-group text-rose-400 text-xs"></i> Family Circle
                </span>
            </div>
        </section>

        <!-- AUTH CARD -->
        <section id="auth-card" class="px-5 pt-2">

            <!-- Social login buttons -->
            <div id="social-logins" class="flex flex-col gap-3 mb-5 slide-up-1">
                <button class="social-btn w-full bg-white border border-sand-200 rounded-2xl py-4 flex items-center justify-center gap-3 font-figtree font-semibold text-sand-600 text-sm" style="box-shadow: 0 2px 12px rgba(139,115,85,0.08);">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>

                <button class="social-btn w-full bg-white border border-sand-200 rounded-2xl py-4 flex items-center justify-center gap-3 font-figtree font-semibold text-sand-600 text-sm" style="box-shadow: 0 2px 12px rgba(139,115,85,0.08);">
                    <i class="fa-brands fa-apple text-sand-700 text-lg"></i>
                    Continue with Apple
                </button>
            </div>

            <!-- Divider -->
            <div id="divider" class="flex items-center gap-3 mb-5 slide-up-2">
                <div class="h-px flex-1 bg-sand-200"></div>
                <span class="font-figtree text-sand-400 text-xs font-medium">or sign in with email</span>
                <div class="h-px flex-1 bg-sand-200"></div>
            </div>

            <!-- Email / Password -->
            <div id="email-form" class="flex flex-col gap-4 mb-5 slide-up-3">
                <div>
                    <label class="font-figtree text-sand-500 text-xs font-semibold mb-1.5 block">Email address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-sand-400 text-sm"></i>
                        <input type="email" placeholder="you@example.com"
                            class="input-field w-full bg-white border border-sand-200 rounded-2xl pl-11 pr-4 py-4 font-figtree text-sand-600 text-sm placeholder-sand-300"
                            style="box-shadow: 0 2px 10px rgba(139,115,85,0.06);">
                    </div>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="font-figtree text-sand-500 text-xs font-semibold">Password</label>
                        <button class="font-figtree text-sand-400 text-xs font-medium">Forgot password?</button>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-sand-400 text-sm"></i>
                        <input type="password" placeholder="••••••••"
                            class="input-field w-full bg-white border border-sand-200 rounded-2xl pl-11 pr-12 py-4 font-figtree text-sand-600 text-sm placeholder-sand-300"
                            style="box-shadow: 0 2px 10px rgba(139,115,85,0.06);">
                        <button class="absolute right-4 top-1/2 -translate-y-1/2">
                            <i class="fa-solid fa-eye text-sand-300 text-sm"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Sign In Button -->
            <button id="signin-btn" class="action-btn slide-up-4 w-full bg-sand-500 text-sand-50 font-outfit font-semibold py-4 rounded-2xl text-base flex items-center justify-center gap-2 mb-5" style="box-shadow: 0 8px 24px rgba(139,115,85,0.30);">
                <i class="fa-solid fa-arrow-right-to-bracket text-base"></i>
                Sign In
            </button>

            <!-- Sign Up prompt -->
            <div id="signup-prompt" class="slide-up-5 text-center mb-6">
                <p class="font-figtree text-sand-400 text-sm">
                    New to FamilyAdmin?
                    <button class="font-semibold text-sand-600 underline underline-offset-2">Create a free account</button>
                </p>
            </div>

            <!-- Trust badges -->
            <div id="trust-row" class="scale-in flex items-center justify-center gap-4 pb-4">
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-shield-halved text-sand-400 text-xs"></i>
                    <span class="font-figtree text-sand-400 text-xs">Secure & private</span>
                </div>
                <span class="w-1 h-1 rounded-full bg-sand-300"></span>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-star text-sand-400 text-xs"></i>
                    <span class="font-figtree text-sand-400 text-xs">Free to start</span>
                </div>
                <span class="w-1 h-1 rounded-full bg-sand-300"></span>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-people-group text-sand-400 text-xs"></i>
                    <span class="font-figtree text-sand-400 text-xs">Family plan</span>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
